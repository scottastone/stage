[package]
name = "stage"
version = "0.1.0"
edition = "2021"
description = "Direct file transfer between machines via Tailscale or direct connection (Rust port)"

[[bin]]
name = "stage"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.9"
getrandom = "0.3"
igd = { version = "0.12.1", optional = true }
indicatif = "0.18.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tar = "0.4.46"
toml = "1.1.3"
ureq = "3.3.0"

[features]
default = ["upnp"]
upnp = ["dep:igd"]

[target."cfg(unix)".dependencies]
libc = "0.2.186"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
